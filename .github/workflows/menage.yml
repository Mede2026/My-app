name: Menage des publications

# Supprime les publications qui ne suivent pas la convention « vX.Y.Z », ainsi
# que leur étiquette. Les publications conformes ne sont jamais touchées.
#
# Ce fichier est temporaire : il est retiré une fois le ménage fait.
on:
  push:
    branches: ["**"]
    paths: [".github/workflows/menage.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  menage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supprimer les publications hors convention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Publications actuelles :"
          gh release list --limit 100

          gh release list --limit 100 --json tagName --jq '.[].tagName' > etiquettes.txt
          while read -r etiquette; do
            if printf '%s' "$etiquette" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Conservée : $etiquette"
            else
              echo "Supprimée : $etiquette"
              gh release delete "$etiquette" --yes --cleanup-tag
            fi
          done < etiquettes.txt

          echo
          echo "Publications restantes :"
          gh release list --limit 100
