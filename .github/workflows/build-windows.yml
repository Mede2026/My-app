name: Build Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests sur Windows (moteur CNG natif)
        run: python -m unittest discover -s tests
      - run: pip install -r requirements-dev.txt
      - run: python scripts/make_icon.py
      - name: Dossier (demarrage rapide)
        run: python -m PyInstaller --noconfirm --clean CryptoBulle.spec
      - name: Fichier unique
        env:
          CRYPTOBULLE_ONEFILE: "1"
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist-onefile CryptoBulle.spec
          Get-ChildItem dist-onefile, dist\CryptoBulle | Measure-Object -Property Length -Sum
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBulle-dossier
          path: dist/CryptoBulle
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBulle-exe-unique
          path: dist-onefile/CryptoBulle.exe
