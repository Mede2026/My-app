name: Build Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Analyse statique (Linux et Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Tests
        run: go test ./...

  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Tests sur Windows (DPAPI compris)
        run: go test ./...

  build:
    needs: [tests, tests-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Compilation croisee
        run: |
          ./scripts/build.sh amd64
          ./scripts/build.sh arm64
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBulle-windows
          path: dist/*.exe
