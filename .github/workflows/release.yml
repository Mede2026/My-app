name: Publier une version

# Une publication est créée automatiquement dès que le numéro de version change
# dans le code (internal/app/doc.go). Le travail tourne à chaque envoi, mais
# s'arrête aussitôt si cette version est déjà publiée : une version, une
# publication, jamais de doublon.
#
# Le numéro est inscrit dans l'exécutable à la compilation, il correspond donc
# toujours à celui de la publication, et la mise à jour automatique s'y fie.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Lire le numéro de version
        id: version
        run: |
          VERSION=$(sed -n 's/^var appVersion = "\(.*\)"$/\1/p' internal/app/doc.go)
          if [ -z "$VERSION" ]; then
            echo "Numéro de version introuvable dans internal/app/doc.go" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version lue : $VERSION"

      - name: Cette version est-elle déjà publiée ?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "deja=oui" >> "$GITHUB_OUTPUT"
            echo "Déjà publiée, rien à faire."
          else
            echo "deja=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        if: steps.existe.outputs.deja == 'non'
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Compilation
        if: steps.existe.outputs.deja == 'non'
        run: |
          VERSION="${{ steps.version.outputs.version }}" ./scripts/build.sh amd64
          VERSION="${{ steps.version.outputs.version }}" ./scripts/build.sh arm64
          ls -lh dist

      - name: Publication
        if: steps.existe.outputs.deja == 'non'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Les empreintes permettent de vérifier que le fichier téléchargé est
          # bien celui compilé ici, et servent à signaler un faux positif à
          # Microsoft.
          {
            echo "### Empreintes SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum CryptoBulle.exe CryptoBulle-arm64.exe)
            echo '```'
            echo
            echo "Windows Defender peut bloquer ces fichiers : ils ne sont pas"
            echo "signés, et l'application intercepte le clavier pour la frappe"
            echo "masquée. Voir la section « Windows Defender » du README."
          } > notes.md

          gh release create "v${{ steps.version.outputs.version }}" \
            dist/CryptoBulle.exe dist/CryptoBulle-arm64.exe \
            --target "$GITHUB_SHA" \
            --title "CryptoBulle ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes
